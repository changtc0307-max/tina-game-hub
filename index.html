<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Tina遊戲櫃</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f6f7;color:#20242a}a{color:inherit}#home{max-width:900px;margin:auto;padding:24px 16px 60px}h1{font-size:29px;margin:5px 0}.sub{color:#707780;margin:7px 0 22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{display:block;text-decoration:none;background:#fff;border:1px solid #e1e5e8;border-radius:17px;padding:19px}.emoji{font-size:34px}.card h2{font-size:19px;margin:8px 0 4px}.card p{font-size:13px;color:#707780;margin:0;line-height:1.5}#game{display:none;height:100%;padding:9px;flex-direction:column;gap:6px}.top{display:flex;align-items:center;gap:7px}.back{font-size:24px;text-decoration:none}.title{font-size:20px;font-weight:700;flex:1}.score{font-weight:700}.layout{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}.controls{background:#fff;border:1px solid #e1e4e7;border-radius:13px;padding:8px}.row{display:flex;gap:5px}input{flex:1;min-width:0;height:43px;border:1px solid #ccd2d7;border-radius:10px;padding:0 10px;font-size:17px}button{height:43px;border:0;border-radius:10px;padding:0 11px;font-weight:650}.go{background:#20252b;color:#fff}.finish{background:#e9edef}.msg{min-height:18px;font-size:12px;margin-top:3px}.bad{color:#a33a3a}.ok{color:#237442}.missing{display:none;max-height:180px;overflow:auto;font-size:12px;line-height:1.55;background:#f7f8f9;border-radius:8px;padding:7px;margin-top:4px}.map{flex:1;min-height:0;background:#fff;border:1px solid #e1e4e7;border-radius:14px;overflow:hidden;touch-action:none}svg{width:100%;height:100%;display:block;touch-action:none}.region{fill:#eef0f2;stroke:#fff;stroke-width:.7;vector-effect:non-scaling-stroke}.region.found{fill:#668396}.region.reveal{fill:#cbd1d6}.label{font-size:8px;text-anchor:middle;pointer-events:none;fill:#20242a;paint-order:stroke;stroke:#fff;stroke-width:2.4px;stroke-linejoin:round;font-weight:650}.loading{font-size:14px;fill:#6f7780;text-anchor:middle}.heroBoard{height:100%;overflow:auto;padding:10px}.roleBox{margin-bottom:14px}.roleTitle{font-weight:750;margin:3px 0 7px}.heroGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}.heroSlot{min-height:36px;border-radius:8px;background:#f0f2f4;display:flex;align-items:center;justify-content:center;font-size:13px;padding:5px;text-align:center;color:#9aa0a6}.heroSlot.hit{background:#dce9e1;color:#234c33;font-weight:700}.heroSlot.revealed{color:#30363b}.roleScore{font-size:12px;color:#747b82;font-weight:500;margin-left:5px}@media(max-width:600px){.grid{grid-template-columns:1fr}}@media(min-width:760px){#game{max-width:1350px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:320px 1fr;gap:12px;min-height:650px}.controls{height:max-content}.row{display:block}input,.go,.finish{width:100%;margin-bottom:6px}.map{min-height:650px}.missing{max-height:360px}}</style></head><body><main id="home"><h1>🎮 Tina遊戲櫃</h1><div class="sub">無限嘗試；想不出來就交卷。</div><div class="grid"><a class="card" href="#countries"><div class="emoji">🌍</div><h2>世界國家大挑戰</h2><p>看世界地圖，把國家全部填出來。</p></a><a class="card" href="#capitals"><div class="emoji">🌎</div><h2>世界首都大挑戰</h2><p>猜世界各國首都，答案以台灣常用中文公布。</p></a><a class="card" href="#japan"><div class="emoji">🗾</div><h2>日本行政區大挑戰</h2><p>把日本 47 個都道府縣全部填出來。</p></a><a class="card" href="#us"><div class="emoji">🇺🇸</div><h2>美國州大挑戰</h2><p>看美國地圖，填出 50 州。</p></a><a class="card" href="#aov"><div class="emoji">⚔️</div><h2>傳說對決英雄大挑戰</h2><p>你還記得多少英雄？依職業分類全部填出來。</p></a></div></main><main id="game"><div cl
